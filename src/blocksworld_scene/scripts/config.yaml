  - wood_cube_red2
  - wood_cube_green2
  - wood_cube_blue2
  - wood_cube_red3
  - wood_cube_green3
  - wood_cube_blue3
  - cube_A
  - cube_N
  - cube_U
  - cube_C
  - cube_O
  - cube_M
